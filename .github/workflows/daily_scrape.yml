name: Daily Job Scraper

on:
  schedule:
    - cron: "0 13 * * *"   # 8:00 AM EST (UTC-5) every day
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  scrape-and-email:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Test OpenAI connectivity
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -c "
          import os, httpx
          api_key = os.environ.get('OPENAI_API_KEY', 'NOT_SET')
          print(f'API key present: {bool(api_key) and api_key != \"NOT_SET\"}')
          print(f'API key prefix: {api_key[:15]}...')
          try:
              r = httpx.get('https://api.openai.com', timeout=10)
              print(f'OpenAI reachable: {r.status_code}')
          except Exception as e:
              print(f'OpenAI NOT reachable: {e}')
          "

      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python main.py
